# Publishes thesis/dashboard/ (one self-contained HTML file, no build step) to GitHub Pages.
# The page is the committed file as is; the thesis workflow checks it matches a fresh rebuild.
name: pages
on:
  push:
    branches: [main]
    paths: ["thesis/dashboard/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: thesis/dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
