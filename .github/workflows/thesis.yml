# Thesis checks. No secrets, no keys, no BigQuery: everything here is free and public.
#   tests:  every headline number in THESIS.md is recomputed from thesis/data and compared with
#           the text, data files are hash-checked, PREREG-2 is re-scored by its own rules once its
#           run is committed, and the dashboard must match a fresh rebuild.
#   onchain: once a day (and on every push) re-confirm the sampled receipts against NEAR's
#           public archival RPC. Kept separate so an RPC rate limit cannot hide a test failure.
#           It also checks the PREREG-2.md OpenTimestamps proof down to a Bitcoin block header.
name: thesis
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test thesis/test/thesis.test.mjs
      - name: PREREG-2 scored by its own rules (exit 2 = its run is not committed yet)
        run: node thesis/score-prereg2.mjs || [ $? -eq 2 ]
      - name: Dashboard is current
        run: node thesis/rebuild.mjs --offline && git diff --exit-code thesis/dashboard
  onchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node thesis/verify.mjs
      - name: PREREG-2.md was timestamped in Bitcoin before its window
        run: node thesis/check-anchor.mjs
